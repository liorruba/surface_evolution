# nginx site for the REGOLIT web UI. Installed to /etc/nginx/sites-available/regolit by
# deploy/setup_droplet.sh (domain and port substituted). certbot --nginx adds the TLS server block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A model run is answered synchronously; allow up to the server's run timeout plus rendering.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
