// Configuation file for REGOLIT
// Written by Lior Rubanenko, 2022
//
// Instructions:
// 1. currently accepts only numerical values.
// 2. To comment, use "//".
// 3. Vertical spaces are ignored.
// 4. Need to edit code after introducing a new variable.
//

//////
// Simulation parameters
//////
// regionWidth is in m
// resolution is size of each pixel in m/pixels
// downsamplingResolution: downsample the surface results (topography and composition) to produce smaller files in m/pixels
// initialThickness is in m
// endTime is in Ma
// Latitude is for calculating shadow fraction
regionWidth           	1000
resolution            	2
downsamplingResolution	10
endTime               	100
printTimeStep   	  	10
isEmplaceEjecta       	1
isEmplaceSecondaries  	0
initialThickness      	100
latitude              	0

//////
// Surface properties
//////
// g: gravitational acceleration, m/s^2
// k1: a dimensionless material strength parameter (Holsapple, 1993)
// Ybar: effective material strength, Pa (Richardson 2009, eq 5)
// mu: impactor energy/momentum scaling
// targetDensity: Surface/target density, kg/m^3
// impactorDensity: impactor density, kg/m^3
// angle_of_repose:	regolith angle of repose (deg)
g                 3.5
k1                0.132
// k2: strength-regime scaling constant (Holsapple 1993; 0.26 for dry soil and lunar regolith, 1 = original model)
k2						1
Ybar              0
mu                0.41
targetDensity     1700
angleOfRepose	  35

//////
// Seismic shaking (Richardson et al. 2005; Richardson 2009, Section 2.6): every impact radiates
// seismicEfficiency of its energy; where the peak acceleration exceeds seismicAccelerationThreshold
// times g the regolith receives one dose of downslope diffusion K_i = Cs v^a D^b g^c / l^d (D the
// impactor diameter) and slopes above the angle of repose collapse; the affected area is settled
// right after each impact (no global relaxation at output steps).
//////
isSeismicShaking  1
seismicEfficiency 1e-5
Q_factor          1500
prim_seis_freq    15
seis_mean_free    1000
seis_wave_vel     3000
seismicAccelerationThreshold 1
Cs                1e-2
Ki_a              0.5
Ki_b              1
Ki_c              0.5
Ki_d              0.5

//////
// Fresh craters properties
//////
//depthToDiameter is the fresh final crater d/D ratio
// Number of shells in z model (for ejecta calc.)
// ejectaSpread is the spread of the ejecta in crater radii
// change numberOfZModelShells if ejecta placement is too low-resolution
// ejectaVolatileRetention is the fraction of ice retained in the crater ejecta post impact
// minimumLayerThickness: deposits thinner than this (m) are mixed into the surface layer instead of
// forming a new layer, so a thin far-field ejecta veneer does not redefine the surface composition.
// Set to 0 to keep every deposit as its own layer.
depthToDiameter         0.2
rimToDiameter           0.04
rimDropoffExponent      4
numberOfZModelShells    100
ejectaSpread            8
ejectaVolatileRetention 0.
ejectaSootRetention 	0.
minimumLayerThickness   0.001
// Secondary craters are ejecta fragments (see README): ejecta landing faster than
// secondaryMinimumVelocity (m/s) forms fragments with N(>L) = (L_max / L)^slope_secondaries; a
// fragment forms a distinct crater only where that crater is deeper than the primary's blanket.
secondaryMinimumVelocity 20
slope_secondaries       4
// secondaryLargestFraction: diameter of the largest secondary, made by the largest fragment landing
// where the secondary field begins (about 3 primary radii), as a fraction of the primary diameter
secondaryLargestFraction 0.05
// secondaryVelocityExponent: faster launch annuli have smaller largest fragments, (v / v_anchor)^-exponent
secondaryVelocityExponent 1
// secondaryDepthToDiameter: depth to diameter ratio of secondary craters (shallower than primaries)
secondaryDepthToDiameter 0.1
// maximumSecondariesPerPrimary: only the largest N secondaries of a primary are formed; smaller fragments are ejecta
maximumSecondariesPerPrimary 20000
// isEmplaceDistantSecondaries: also sample the primaries outside the domain, out to secondaryMaximumRange (m)
// beyond its edge, and form the fragments they send in (0 = only primaries inside the domain)
isEmplaceDistantSecondaries 0
secondaryMaximumRange 100000
// Test mode: testCraterDiameter > 0 forms one crater of that final diameter (m) at (testCraterX, testCraterY)
// instead of the random population; the surface is printed before and after it
// histogramBinsPerDecade: log bins per decade of the size and depth histograms written to output/
histogramBinsPerDecade 20
testCraterDiameter 0
testCraterX 0
testCraterY 0
//////
// Impactor population properties
//////
// Slope and coefficient are from the global bolide data
// Moon/Earth flux cross-sectional ratio is taken from Ivanov, 2006
// minimumImpactorDiameter is the minimum diameter in the impactor population, m
// fluxConstant_c is the number of craters (>1 km) / m^2 / Ma
slope_b                   2.52
fluxConstant_c            6.66e-08
earthFluxRatioCoefficient 1.8
minimumImpactorDiameter   0.1
impactorDensity           2000
meanImpactVelocity        17.5e3
impactAngle               45

//////
// Crater profile type
//////
// options:
// 1 for parabolic,
// 2 for bowl-shaped (spherical)
craterProfileType       2

//////
// Subsurface properties
// Densities are material densities, not bulk
// c is speed of sound in material (km / s)
// s is the slope of the shock velocity / particle velocity relation
// sublimationInterval is the interval to erodde ice from the surface (in Ma)
// sublimationThickness is the thickness to erode (in m)
// iceEmplacementInterval is the interval to deposit ice on the surface (in Ma)
// iceEmplacementThickness is the thickness of deposited ice (in m)
//////
c_ice           		1.7
s_ice           		1.44
regolithDensity 		3000
sootDensity				1000
iceDensity      		1000
c_regolith      		3.95
s_regolith      		1.34
ice_fraction    		0.5
porosity        		0
// isVolatiles: 1 turns on the ice and soot processes below (periodic ice deposition, sublimation, loss of
// ice and soot from the ejecta); 0 keeps ice and soot as passive tracers of the initial layers
isVolatiles             0
sublimationInterval     10
sublimationThickness    0.0
iceEmplacementInterval	100
iceEmplacementThickness 0.0

/////////
// Other
// isPrintSubsurface: print the layer stacks? 0 never, 1 at every print step (may take significant disk space
// for large grids), 2 at the final step only
// randomSeed: seed for random number generator
// depthToIntegrate: depth to integrate when printing the integrated subsurface maps
// debug, runTests: in development
/////////
isPrintSubsurface 		1
randomSeed				2
depthToIntegrate		0.2
runTests        		0
debug           		0